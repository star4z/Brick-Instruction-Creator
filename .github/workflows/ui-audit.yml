name: Desktop & Mobile UI E2E Audit

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build static bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Desktop & Mobile UI E2E audit
        run: npm run test:e2e

      - name: Upload Playwright report & failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
